
<div>
  <!--loading-->
  <div *ngIf="cargando" class="d-flex justify-content-center">
    <div class="spinner-border mt-5 text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="!cargando">
    <!--Navegacion con breadcrumbs-->
    <div class="mx-2">
      <div class="row">
        <nav class="ms-3 mt-3" aria-label="breadcrumb">
          <ol class="breadcrumb gma-breadcrumb">
            <li class="breadcrumb-item">
              <a href="/empresas">
                <i class="g-icon fa-solid fa-briefcase  me-1"></i>
                Empresas</a>
            </li>
            <li class="breadcrumb-item">
              <a [href]="'/empresas/ver/' + empresa.id">
                {{empresa.nombre}}
              </a>
            </li>
            <li class="breadcrumb-item">
              <a [href]="'/empresas/' + empresa.id + '/usuarios'">
                Usuarios
              </a>
            </li>
            <li class="breadcrumb-item" aria-current="page">
              <a [href]="'/empresas/' + empresa.id + '/usuarios/ver/' + usuario.id">
                {{usuario.nombre}}
              </a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">
              Editar
            </li>
          </ol>
        </nav>
      </div>
      <hr class="gma-hr border border-success border-1 opacity-75">
    </div>

    <!--Contenido-->
    <div class="d-flex justify-content-center align-items-center gma-page-center">
      <div class="card shadow my-2 text-center border border-dark gma-card-panel gma-card-panel--wide">
    
        <div class="card-body">
          <!--FORM Usuario-->
          <form [formGroup]="formulario" id="form" class="my-2">
            <!--Nombre-->
            <div id="fieldNombre" class="mb-3 me-sm-5 row">
              <label for="inputNombre" class="col-sm-4 col-form-label">
                <span class="text-danger">*</span>
                Nombre
              </label>
              <div class="col-sm-8">
                <input formControlName="nombre" type="text" class="form-control border border-dark" id="inputNombre">
                <div class="d-flex">
                  <small class="text-danger" *ngIf="errorEnControlador('nombre', 'required')">Nombre requerido</small>
                </div>
              </div>
            </div>
            <!--Correo-->
            <div id="fieldCorreo" class="mb-3 me-sm-5 row">
              <label for="inputCorreo" class="col-sm-4 col-form-label">
                <span class="text-danger">*</span>
                Correo Electrónico
              </label>
              <div class="col-sm-8">
                <input formControlName="correo" type="email" class="form-control border border-dark" id="inputCorreo">
                <div class="d-flex">
                  <small class="text-danger" *ngIf="errorEnControlador('correo', 'required')">Correo requerido</small>
                  <small class="text-danger" *ngIf="errorEnControlador('correo', 'email')">Formato de correo
                    inválido</small>
                </div>
              </div>
            </div>
    
            <!--Tipo-->
            <div id="fieldTipo" class="mb-3 me-sm-5 row">
              <label for="inputTipo" class="col-sm-4 col-form-label">
                <span class="text-danger">*</span>
                Tipo
              </label>
              <div class="col-sm-8">
                <select formControlName="tipo" id="inputTipo" class="form-select border border-dark">
                  <option value="select-valor-vacio" selected>Seleccione el tipo</option>
                  <option value={{tipo.valor}} *ngFor="let tipo of tipos">{{tipo.etiqueta}}</option>
                </select>
                <div class="d-flex">
                  <small class="text-danger" *ngIf="errorEnControlador('tipo', 'required')">Tipo requerido</small>
                  <small class="text-danger" *ngIf="errorEnControlador('tipo', 'emptySelect')">Tipo requerido</small>
                </div>
              </div>
            </div>
          </form>
        </div>
    
        <div class="card-footer">
          <!--Acciones-->
          <div class="mb-3 mx-sm-5 row align-items-center">
            <button (click)="editarUsuario()" class="btn btn-primary col-12 col-sm-3" type="submit">Editar Usuario</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
