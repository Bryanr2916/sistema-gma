<div>
    <!--loading-->
    <div *ngIf="cargando" class="d-flex justify-content-center">
        <div class="spinner-border mt-5 text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div *ngIf="!cargando">
        <!--Navegacion con breadcrumbs-->
        <div class="mx-2">
            <div class="row">
                <nav class="ms-3 mt-3" aria-label="breadcrumb">
                    <ol class="breadcrumb gma-breadcrumb">
                        <li class="breadcrumb-item">
                            <a href="/empresas">
                                <i class="g-icon fa-solid fa-briefcase  me-1"></i>
                                Empresas</a>
                        </li>
                        <li class="breadcrumb-item">
                            {{empresa.nombre}}
                        </li>
                    </ol>
                </nav>
            </div>
            <hr class="gma-hr border border-success border-1 opacity-75">
        </div>

        <!--Contenido-->
        <div class="d-flex justify-content-center align-items-center gma-page-center">
            <div class="card shadow my-2 border border-dark gma-card-panel">
                <div *ngIf="!cargando" class="card-body mb-4 mx-3">
                    <!--Imagen-->
                    <div class="row mb-2">
                        <div *ngIf="empresa.urlLogo !== ''" class="col-12 col-sm-4 offset-sm-4">
                            <img src="{{empresa.urlLogo}}" alt="">
                        </div>
                    </div>
                    <!--Nombre - Correo-->
                    <div class="row mb-2">
                        <div class="col-12 col-sm-6">
                            <h3>Nombre:</h3>
                            <p class="lead">{{empresa.nombre}}</p>
                        </div>
                        <div class="col-12 col-sm-6">
                            <h3>Correo:</h3>
                            <p class="lead">{{empresa.correo}}</p>
                        </div>
                    </div>
                    <!--Telefono - Paises-->
                    <div class="row mb-2">
                        <div class="col-12 col-sm-6">
                            <h3>Teléfono:</h3>
                            <p class="lead">{{empresa.telefono}}</p>
                        </div>
                        <div class="col-12 col-sm-6">
                            <h3><i class="g-icon fa-solid fa-globe"></i> Paises:</h3>
                            <ul class="list-group">
                                <li class="list-group-item list-group-item-info" *ngFor="let ps of empresa.paises">
                                    {{ps}}
                                </li>
                            </ul>
                            <p class="lead">{{empresa.pais}}</p>
                        </div>
                    </div>
                    <!--Notas-->
                    <div class="row">
                        <div *ngIf="empresa.notas !==''" class="col-12 col-sm-6">
                            <h3>Notas:</h3>
                            <p class="lead">{{empresa.notas}}</p>
                        </div>
                        <div *ngIf="empresa.admin" class="col-12 col-sm-6">
                            <h3>Administrador:</h3>
                            <p class="lead">{{empresa.admin}}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
