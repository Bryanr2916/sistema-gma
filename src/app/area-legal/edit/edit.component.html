
<div>
    <!--loading-->
    <div *ngIf="cargando" class="d-flex justify-content-center">
        <div class="spinner-border mt-5 text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div *ngIf="!cargando">
        <!--Navegacion con breadcrumbs-->
        <div class="mx-2">
            <div class="row">
                <nav class="ms-3 mt-3" aria-label="breadcrumb">
                    <ol class="breadcrumb gma-breadcrumb">
                        <li class="breadcrumb-item">
                            <a href="/area-legal">
                                <i class="g-icon fa-solid fa-bookmark me-1"></i>
                                Área Legal
                            </a>
                        </li>
                        <li class="breadcrumb-item active">
                            {{areaLegal.nombre}}
                        </li>
                        <li class="breadcrumb-item active">
                            Editar
                        </li>
                    </ol>
                </nav>
            </div>
            <hr class="gma-hr border border-success border-1 opacity-75">
        </div>

        <!--Contenido-->
        <div class="d-flex justify-content-center align-items-center gma-page-center">
            <div class="card shadow mb-5 text-center border border-dark gma-card-panel">
                <div class="card-body">
                    <form [formGroup]="formulario" id="form" class="my-2">
                        <!--Nombre-->
                        <div class="mb-3 me-sm-5 row" id="fieldNombre">
                            <label for="inputNombre" class="col-sm-4 col-form-label">
                                <span class="text-danger">*</span>
                                Nombre
                            </label>
                            <div class="col-sm-8">
                                <input formControlName="nombre" type="text" class="form-control border border-dark"
                                    id="inputNombre">
                                <div class="d-flex">
                                    <small class="text-danger" *ngIf="errorEnControlador('nombre', 'required')">Nombre
                                        requerido</small>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="card-footer">
                    <!--Acciones-->
                    <div class="mb-3 mx-sm-5 row align-items-center">
                        <button (click)="editarArea()" class="btn btn-primary col-12 col-sm-3" type="submit">Editar área
                            legal</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
