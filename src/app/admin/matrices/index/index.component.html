
<div>
  <!--loading-->
  <div *ngIf="cargando" class="d-flex justify-content-center">
    <div class="spinner-border mt-5 text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="!cargando">
    <!--Navegacion con breadcrumbs-->
    <div class="mx-2">
      <div class="row">
        <nav class="ms-3 mt-3" aria-label="breadcrumb">
          <ol class="breadcrumb gma-breadcrumb">
            <li class="breadcrumb-item active">
              <i class="g-icon fa-solid fa-table-cells me-1"></i>
              Matrices
            </li>
          </ol>
        </nav>
      </div>
      <hr class="gma-hr border border-success border-1 opacity-75">
    </div>
    <!--Contenido-->
    <div class="mb-2 mx-2 gma-page-center">
    
      <div class="content-container">
        <!--Nav-->
        <ul class="nav nav-pills mt-4">
          <li class="nav-item">
            <div class="input-group mb-3">
              <span class="input-group-text border- border-dark" id="basic-addon1"><i
                  class="fa-solid fa-magnifying-glass"></i></span>
              <input (ngModelChange)="buscar($event)" [(ngModel)]="busqueda" [ngModelOptions]="{standalone:true}"
                type="text" class="form-control border- border-dark" placeholder="Buscar..." aria-label="Username"
                aria-describedby="basic-addon1">
            </div>
          </li>
          <li class="nav-item mx-2">
            <a class="nav-link active" routerLink="crear"><i class="fa-solid fa-plus"></i> Crear matriz</a>
          </li>
        </ul>

        <!--Filtros-->
        <div class="filtros-tabla mt-2">
          <app-dropdown-search *ngIf="esAdminSistema" class="filtro-item" [opciones]="opcionesEmpresa"
            labelField="label" valueField="key" [searchFields]="['label']" placeholder="Buscar empresa..."
            labelSeleccionVacia="Empresa" [valor]="filtroEmpresa"
            (valorChange)="cambiarFiltroEmpresa($event)"></app-dropdown-search>

          <app-dropdown-search class="filtro-item" [opciones]="opcionesArticulos" labelField="label"
            valueField="key" [searchFields]="['label']" placeholder="Artículos aplicables..."
            labelSeleccionVacia="Artículos" [valor]="filtroArticulos"
            (valorChange)="cambiarFiltroArticulos($event)"></app-dropdown-search>

          <button *ngIf="hayFiltrosActivos" type="button" class="btn btn-link text-success filtros-limpiar"
            (click)="limpiarFiltros()">
            <i class="fa-solid fa-xmark me-1"></i>Limpiar filtros
          </button>
        </div>

        <!--table-->
        <div *ngIf="matricesFiltradas.length > 0" class="table-responsive mb-4 mt-2">
          <table class="table table-light table-striped table-hover shadow table-bordered">
            <thead>
              <tr class="table-success">
                <th></th>
                <th scope="col" *ngFor="let th of ths">{{th}}</th>
              </tr>
            </thead>
            <tbody>
              <tr class="selectable-row" *ngFor="let matriz of matricesFiltradas; index as i" (click)="verMatriz(i)">
                <th>
                  <input [checked]="filaSeleccionada === i" (click)="seleccionarFila($event, i)"
                    class="form-check-input border border-dark" type="checkbox" value="" id="checkDefault">
                </th>
                <th scope="row">{{ i + 1}}</th>
                <td>{{matriz.titulo}}</td>
                <td><span class="badge text-bg-success">{{obtenerCantidadArticulosAplicables(matriz.id)}}</span></td>
                <td *ngIf="usuario.tipo === tiposUsuario.adminSistema">{{nombreEmpresa(matriz.empresa)}}</td>
              </tr>
            </tbody>
          </table>
    
          <!-- Acciones flotantes -->
          <div [ngClass]="filaSeleccionada !== -1 ? 'active' : ''" class="table-actions border border-dark">
            <a (click)="borrarFila()" class="d-inline-flex align-items-center">
              <i class="r-icon fa-solid fa-trash fa-lg me-2"></i>
              <span class="table-action-text">Borrar</span>
            </a>
            <div class="vr text-success"></div>
            <a (click)="editarFila()" class="d-inline-flex align-items-center">
              <i class="b-icon fa-solid fa-pen-to-square fa-lg me-2"></i>
              <span class="table-action-text">Editar</span>
            </a>
            <div class="vr text-success"></div>
            <a (click)="crearArticulosFila()" class="d-inline-flex align-items-center">
              <i class="g-icon fa-solid fa-newspaper fa-lg me-2"></i>
              <span class="table-action-text">Crear artículos</span>
            </a>
          </div>
        </div>
        <!--No hay resultados-->
        <div *ngIf="matricesFiltradas.length === 0 && matricesTodas.length > 0" class="my-4">
          <h4><i class="y-icon fa-solid fa-triangle-exclamation"></i> No se encontraron resultados</h4>
        </div>
        <!--No Hay matrices-->
        <div *ngIf="matricesTodas.length === 0" class="my-4">
          <h4><i class="y-icon fa-solid fa-triangle-exclamation"></i> No hay Matrices registradas</h4>
        </div>
      </div>
    </div>
  </div>
</div>
